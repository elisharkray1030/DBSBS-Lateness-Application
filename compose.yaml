services:
  lateness-app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /data/lateness_history.db
      NAMELIST_PATH: /data/namelist.csv
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the environment before starting.}
    volumes:
      - ./data:/data
      - ./namelist.csv:/data/namelist.csv:ro
    restart: unless-stopped