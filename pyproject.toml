[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
# Deliberately NOT strict = true — app.py gets rewritten by #129 (app factory).
# Revisit strict after #129 lands.

[tool.pytest.ini_options]
testpaths = ["tests"]
